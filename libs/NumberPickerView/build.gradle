apply plugin: 'com.android.library'

android {
    compileSdkVersion 36
    namespace 'cn.carbswang.android.numberpickerview'

    defaultConfig {
        minSdkVersion 23
    }

    sourceSets {
        main {
            manifest.srcFile 'NumberPickerView/src/main/AndroidManifest.xml'
            java.srcDirs = ['NumberPickerView/src/main/java']
            res.srcDirs = ['NumberPickerView/src/main/res']
        }
    }
}
